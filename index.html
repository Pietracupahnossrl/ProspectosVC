<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Prospectos — Via Cargo San Nicolás</title>
<style>
:root{--red:#C8102E;--red-light:#fbeaed;--green:#16a34a;--blue:#1d4ed8;--gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;--gray-400:#9ca3af;--gray-600:#4b5563;--gray-800:#1f2937;--white:#ffffff;--font:'Inter',system-ui,sans-serif;--rs:6px;--rm:8px;--rl:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:#f5f5f0;color:var(--gray-800);min-height:100vh}
.header{background:var(--white);border-bottom:1px solid var(--gray-200);padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:36px;height:36px;background:var(--red);border-radius:var(--rm);display:flex;align-items:center;justify-content:center}
.logo-icon svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.logo-title{font-size:15px;font-weight:600}
.logo-sub{font-size:12px;color:var(--gray-400)}
.header-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{padding:7px 14px;border-radius:var(--rs);font-size:13px;font-family:var(--font);cursor:pointer;border:none;font-weight:500;transition:.15s;display:flex;align-items:center;gap:6px}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{opacity:.9}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{opacity:.9}
.btn-sec{background:var(--gray-100);color:var(--gray-800);border:1px solid var(--gray-200)}.btn-sec:hover{background:var(--gray-200)}
.btn-blue{background:var(--blue);color:#fff}.btn-blue:hover{opacity:.9}
.btn:disabled{opacity:.5;cursor:not-allowed}
.main{max-width:1100px;margin:0 auto;padding:1.5rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:1.5rem}
.kpi{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--rl);padding:.875rem 1rem}
.kpi-label{font-size:11px;color:var(--gray-400);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.kpi-value{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi-value.red{color:var(--red)}.kpi-value.green{color:var(--green)}.kpi-value.blue{color:var(--blue)}
.kpi-sub{font-size:11px;color:var(--gray-400);margin-top:2px}
.card{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--rl);padding:1.25rem;margin-bottom:1rem}
.card-title{font-size:13px;font-weight:600;color:var(--gray-600);text-transform:uppercase;letter-spacing:.05em;margin-bottom:1rem;display:flex;align-items:center;gap:6px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
.filters input,.filters select{padding:7px 10px;border:1px solid var(--gray-200);border-radius:var(--rs);font-size:13px;font-family:var(--font);background:var(--gray-50);color:var(--gray-800)}
.filters input{flex:1;min-width:160px}
.prospect-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.prospect-card{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--rl);padding:1rem;transition:.15s}
.prospect-card:hover{border-color:var(--red);box-shadow:0 2px 8px rgba(200,16,46,.08)}
.prospect-card.nuevo{border-left:3px solid var(--green)}
.p-name{font-size:14px;font-weight:600;margin-bottom:4px}
.p-rubro{font-size:11px;color:var(--white);background:var(--red);padding:2px 8px;border-radius:20px;display:inline-block;margin-bottom:8px}
.p-rating{font-size:11px;color:var(--gray-400);margin-bottom:8px}
.p-contact{display:flex;flex-direction:column;gap:5px}
.p-contact a{font-size:12px;color:var(--blue);text-decoration:none;display:flex;align-items:center;gap:5px}
.p-contact a:hover{text-decoration:underline}
.p-contact svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.p-actions{display:flex;gap:6px;margin-top:10px}
.p-btn{padding:4px 10px;font-size:11px;border-radius:var(--rs);border:1px solid var(--gray-200);cursor:pointer;font-family:var(--font);background:var(--gray-50);color:var(--gray-600);transition:.15s}
.p-btn:hover{border-color:var(--red);color:var(--red)}
.p-btn.wa{background:#25D366;color:#fff;border-color:#25D366}.p-btn.wa:hover{opacity:.9}
.p-nuevo-badge{font-size:10px;color:var(--green);font-weight:600;float:right}
.status-bar{font-size:12px;color:var(--gray-400);padding:.5rem 0;text-align:center}
.progress{height:3px;background:var(--gray-100);border-radius:2px;margin:8px 0;overflow:hidden;display:none}
.progress-bar{height:100%;background:var(--red);border-radius:2px;transition:width .3s}
.empty{text-align:center;padding:3rem;color:var(--gray-400);font-size:13px}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.tag-new{background:#dcfce7;color:#166534}
.tag-email{background:#dbeafe;color:#1e40af}
.tag-phone{background:#fef3c7;color:#92400e}
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13" rx="1"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
    </div>
    <div>
      <div class="logo-title">Prospectos — Via Cargo San Nicolás</div>
      <div style="display:flex;align-items:center;gap:8px">
      <select id="ciudad-selector" onchange="cambiarCiudad(this.value)" style="padding:4px 8px;border:1px solid var(--gray-200);border-radius:var(--rs);font-size:12px;font-family:var(--font);background:var(--gray-50);color:var(--gray-800)">
        <option value="sn">📍 San Nicolás de los Arroyos</option>
        <option value="vc">📍 Villa Constitución</option>
      </select>
    </div>
    <div class="logo-sub" id="last-update">Sin actualizaciones aún</div>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn btn-sec" onclick="copiarTelefonos()" id="btn-copy-phone">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81a19.79 19.79 0 01-3.07-8.72A2 2 0 012 .95h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 8.91a16 16 0 006.07 6.07l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
      Copiar teléfonos
    </button>
    <button class="btn btn-sec" onclick="copiarEmails()" id="btn-copy-email">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
      Copiar emails
    </button>
    <button class="btn btn-red" onclick="actualizarProspectos()" id="btn-update">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      Actualizar prospectos
    </button>
  </div>
</div>

<div class="main">
  <div class="kpis">
    <div class="kpi"><div class="kpi-label">Total prospectos</div><div class="kpi-value red" id="k-total">0</div></div>
    <div class="kpi"><div class="kpi-label">Con email</div><div class="kpi-value blue" id="k-email">0</div></div>
    <div class="kpi"><div class="kpi-label">Con teléfono</div><div class="kpi-value green" id="k-phone">0</div></div>
    <div class="kpi"><div class="kpi-label">Nuevos este mes</div><div class="kpi-value" id="k-new">0</div></div>
  </div>

  <div class="card">
    <div class="progress" id="progress-wrap"><div class="progress-bar" id="progress-bar" style="width:0%"></div></div>
    <div id="status-msg" class="status-bar">Hacé click en "Actualizar prospectos" para buscar negocios en San Nicolás.</div>
    <div class="filters">
      <input type="text" id="search-input" placeholder="Buscar por nombre o rubro..." oninput="renderProspectos()"/>
      <select id="filter-rubro" onchange="renderProspectos()">
        <option value="">Todos los rubros</option>
      </select>
      <select id="filter-contacto" onchange="renderProspectos()">
        <option value="">Todos los contactos</option>
        <option value="email">Con email</option>
        <option value="phone">Con teléfono</option>
        <option value="ambos">Con ambos</option>
      </select>
      <select id="filter-nuevo" onchange="renderProspectos()">
        <option value="">Todos</option>
        <option value="nuevo">Solo nuevos</option>
      </select>
    </div>
    <div class="prospect-grid" id="prospect-grid">
      <div class="empty">Sin prospectos cargados. Hacé click en "Actualizar prospectos".</div>
    </div>
  </div>
</div>

<script>
const API_KEY = 'AIzaSyBiRVQHBYi9gd11Gi8LFhQ-qvtWYKRhcyc';
const FIREBASE_URL = 'https://prospectovc-default-rtdb.firebaseio.com';
const CIUDADES = {
  sn: {
    nombre: 'San Nicolás de los Arroyos',
    lat: -33.3333, lng: -60.2167,
    fbKey: 'prospectos_sn',
    rubros: [
      {nombre:'Indumentaria',query:'tienda de ropa San Nicolas de los Arroyos'},
      {nombre:'Calzado',query:'zapateria San Nicolas de los Arroyos'},
      {nombre:'Electrónica',query:'celulares electronica San Nicolas de los Arroyos'},
      {nombre:'Ferretería',query:'ferreteria San Nicolas de los Arroyos'},
      {nombre:'Distribuidora',query:'distribuidora San Nicolas de los Arroyos'},
      {nombre:'Accesorios',query:'accesorios bijouteria San Nicolas de los Arroyos'},
      {nombre:'Farmacia',query:'farmacia San Nicolas de los Arroyos'},
      {nombre:'Veterinaria',query:'veterinaria San Nicolas de los Arroyos'},
      {nombre:'Repuestos',query:'repuestos autos motos San Nicolas de los Arroyos'},
      {nombre:'Librería',query:'libreria papeleria San Nicolas de los Arroyos'},
    ]
  },
  vc: {
    nombre: 'Villa Constitución',
    lat: -33.2285, lng: -60.3358,
    fbKey: 'prospectos_vc',
    rubros: [
      {nombre:'Indumentaria',query:'tienda de ropa Villa Constitucion'},
      {nombre:'Calzado',query:'zapateria Villa Constitucion'},
      {nombre:'Electrónica',query:'celulares electronica Villa Constitucion'},
      {nombre:'Ferretería',query:'ferreteria Villa Constitucion'},
      {nombre:'Distribuidora',query:'distribuidora Villa Constitucion'},
      {nombre:'Accesorios',query:'accesorios bijouteria Villa Constitucion'},
      {nombre:'Farmacia',query:'farmacia Villa Constitucion'},
      {nombre:'Veterinaria',query:'veterinaria Villa Constitucion'},
      {nombre:'Repuestos',query:'repuestos autos motos Villa Constitucion'},
      {nombre:'Librería',query:'libreria papeleria Villa Constitucion'},
    ]
  }
};
let ciudadActual = 'sn';

let prospectos = [];
let mesActual = new Date().toISOString().substring(0,7);

// Firebase helpers
async function fbRead(path){
  const r = await fetch(FIREBASE_URL+path+'.json');
  return r.ok ? r.json() : null;
}
async function fbWrite(path, data){
  await fetch(FIREBASE_URL+path+'.json',{method:'PUT',body:JSON.stringify(data)});
}

async function loadData(){
  const ciudad = CIUDADES[ciudadActual];
  const data = await fbRead('/'+ciudad.fbKey);
  if(data){
    prospectos = Array.isArray(data) ? data : Object.values(data);
    renderProspectos();
    updateKPIs();
    const lu = await fbRead('/lastUpdate_'+ciudadActual);
    if(lu) document.getElementById('last-update').textContent = 'Última actualización: '+lu;
  }
}

async function actualizarProspectos(){
  const btn = document.getElementById('btn-update');
  btn.disabled = true;
  btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> Buscando...';
  
  const progressWrap = document.getElementById('progress-wrap');
  const progressBar = document.getElementById('progress-bar');
  const statusMsg = document.getElementById('status-msg');
  progressWrap.style.display = 'block';

  const ciudad = CIUDADES[ciudadActual];
  const nuevos = [];
  const idsExistentes = new Set(prospectos.map(p=>p.id));

  for(let i=0; i<ciudad.rubros.length; i++){
    const rubro = ciudad.rubros[i];
    progressBar.style.width = ((i/ciudad.rubros.length)*80)+'%';
    statusMsg.textContent = 'Buscando '+rubro.nombre+' en '+ciudad.nombre+'...';

    try{
      const resp = await fetch(`https://places.googleapis.com/v1/places:searchText`,{
        method:'POST',
        headers:{'Content-Type':'application/json','X-Goog-Api-Key':API_KEY,'X-Goog-FieldMask':'places.id,places.displayName,places.formattedAddress,places.internationalPhoneNumber,places.websiteUri,places.rating,places.userRatingCount'},
        body: JSON.stringify({textQuery:rubro.query, locationBias:{circle:{center:{latitude:ciudad.lat,longitude:ciudad.lng},radius:5000.0}}})
      });
      const data = await resp.json();
      if(data.places){
        for(const place of data.places){
          const id = place.id;
          if(idsExistentes.has(id)) continue;
          const phone = place.internationalPhoneNumber||'';
          const email = ''; // Google Places no provee email directamente
          const website = place.websiteUri||'';
          // Solo incluir si tiene teléfono
          if(!phone) continue;
          nuevos.push({
            id, nombre:place.displayName?.text||'Sin nombre',
            rubro:rubro.nombre, direccion:place.formattedAddress||'',
            phone, email, website,
            rating:place.rating||0, reviews:place.userRatingCount||0,
            mes:mesActual, nuevo:true
          });
          idsExistentes.add(id);
        }
      }
    } catch(e){
      console.error('Error buscando '+rubro.nombre, e);
    }
    await new Promise(r=>setTimeout(r,300));
  }

  progressBar.style.width = '90%';
  statusMsg.textContent = 'Guardando '+nuevos.length+' prospectos nuevos...';

  // Marcar los ya existentes como no nuevos
  prospectos = prospectos.map(p=>({...p, nuevo:false}));
  prospectos = [...prospectos, ...nuevos];

  await fbWrite('/'+ciudad.fbKey, prospectos);
  const now = new Date().toLocaleString('es-AR');
  await fbWrite('/lastUpdate_'+ciudadActual, now);

  progressBar.style.width = '100%';
  statusMsg.textContent = nuevos.length > 0 
    ? `✅ Se encontraron ${nuevos.length} prospectos nuevos.`
    : '✅ Actualización completa. No hay prospectos nuevos esta vez.';
  document.getElementById('last-update').textContent = 'Última actualización: '+now;

  setTimeout(()=>{progressWrap.style.display='none';},1500);
  btn.disabled = false;
  btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> Actualizar prospectos';

  renderProspectos();
  updateKPIs();
}

function renderProspectos(){
  const search = document.getElementById('search-input').value.toLowerCase();
  const filterRubro = document.getElementById('filter-rubro').value;
  const filterContacto = document.getElementById('filter-contacto').value;
  const filterNuevo = document.getElementById('filter-nuevo').value;

  let filtered = prospectos.filter(p=>{
    if(search && !p.nombre.toLowerCase().includes(search) && !p.rubro.toLowerCase().includes(search)) return false;
    if(filterRubro && p.rubro !== filterRubro) return false;
    if(filterContacto === 'email' && !p.email) return false;
    if(filterContacto === 'phone' && !p.phone) return false;
    if(filterContacto === 'ambos' && (!p.email || !p.phone)) return false;
    if(filterNuevo === 'nuevo' && !p.nuevo) return false;
    return true;
  });

  // Update rubro filter options
  const rubros = [...new Set(prospectos.map(p=>p.rubro))].sort();
  const rubroEl = document.getElementById('filter-rubro');
  const currentVal = rubroEl.value;
  rubroEl.innerHTML = '<option value="">Todos los rubros</option>';
  rubros.forEach(r=>{
    const opt = document.createElement('option');
    opt.value = r; opt.textContent = r;
    if(r===currentVal) opt.selected = true;
    rubroEl.appendChild(opt);
  });

  const grid = document.getElementById('prospect-grid');
  if(!filtered.length){
    grid.innerHTML = '<div class="empty">No hay prospectos que coincidan con los filtros.</div>';
    return;
  }

  grid.innerHTML = filtered.map(p=>`
    <div class="prospect-card ${p.nuevo?'nuevo':''}">
      ${p.nuevo?'<span class="p-nuevo-badge tag tag-new">NUEVO</span>':''}
      <div class="p-name">${p.nombre}</div>
      <span class="p-rubro">${p.rubro}</span>
      ${p.rating?`<div class="p-rating">⭐ ${p.rating} (${p.reviews} reseñas)</div>`:''}
      ${p.direccion?`<div style="font-size:11px;color:var(--gray-400);margin-bottom:8px">${p.direccion}</div>`:''}
      <div class="p-contact">
        ${p.phone?`<a href="tel:${p.phone}"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81a19.79 19.79 0 01-3.07-8.72A2 2 0 012 .95h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 8.91a16 16 0 006.07 6.07l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>${p.phone}</a>`:''}
        ${p.phone?`<a href="https://wa.me/${p.phone.replace(/[^0-9]/g,'')}" target="_blank"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>Abrir WhatsApp</a>`:''}
        ${p.email?`<a href="mailto:${p.email}"><svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>${p.email}</a>`:''}
        ${p.website?`<a href="${p.website}" target="_blank"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>Sitio web</a>`:''}
      </div>
      <div class="p-actions">
        <button class="p-btn wa" onclick="abrirWA('${p.phone}')">WhatsApp</button>
        ${p.email?`<button class="p-btn" onclick="copiarEmail('${p.email}')">Copiar email</button>`:''}
        <button class="p-btn" onclick="marcarContactado('${p.id}')">Contactado</button>
      </div>
    </div>`).join('');
}

function updateKPIs(){
  document.getElementById('k-total').textContent = prospectos.length;
  document.getElementById('k-email').textContent = prospectos.filter(p=>p.email).length;
  document.getElementById('k-phone').textContent = prospectos.filter(p=>p.phone).length;
  document.getElementById('k-new').textContent = prospectos.filter(p=>p.nuevo).length;
}

function abrirWA(phone){
  const num = phone.replace(/[^0-9]/g,'');
  window.open('https://wa.me/'+num,'_blank');
}

function copiarEmail(email){
  navigator.clipboard.writeText(email);
}

function copiarTelefonos(){
  const phones = prospectos.filter(p=>p.phone).map(p=>p.phone.replace(/[^0-9+]/g,''));
  if(!phones.length){alert('No hay teléfonos guardados.');return;}
  navigator.clipboard.writeText(phones.join('\n'));
  const btn = document.getElementById('btn-copy-phone');
  btn.textContent = '✅ '+phones.length+' teléfonos copiados';
  setTimeout(()=>{btn.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81a19.79 19.79 0 01-3.07-8.72A2 2 0 012 .95h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 8.91a16 16 0 006.07 6.07l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg> Copiar teléfonos';},2500);
}

function copiarEmails(){
  const emails = prospectos.filter(p=>p.email).map(p=>p.email);
  if(!emails.length){alert('No hay emails guardados.');return;}
  navigator.clipboard.writeText(emails.join(', '));
  const btn = document.getElementById('btn-copy-email');
  btn.textContent = '✅ '+emails.length+' emails copiados';
  setTimeout(()=>{btn.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> Copiar emails';},2500);
}

async function marcarContactado(id){
  prospectos = prospectos.map(p=>p.id===id?{...p,contactado:true,fechaContacto:new Date().toISOString().substring(0,10)}:p);
  await fbWrite('/prospectos', prospectos);
  renderProspectos();
}

function cambiarCiudad(ciudad){
  ciudadActual = ciudad;
  prospectos = [];
  document.getElementById('last-update').textContent = 'Sin actualizaciones aún';
  document.getElementById('status-msg').textContent = 'Hacé click en "Actualizar prospectos" para buscar negocios en '+CIUDADES[ciudad].nombre+'.';
  renderProspectos();
  updateKPIs();
  loadData();
}

loadData();
</script>
